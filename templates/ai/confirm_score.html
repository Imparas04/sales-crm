{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>AI Lead Score - SalesAI CRM</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
    <div class="page-box">
        <h2>AI Lead Scoring</h2>
        <p>Ask AI to score <b>{{ lead.name }}</b>'s likelihood to convert?</p>
        <form method="post">{% csrf_token %}<button type="submit" class="btn">Generate AI Score</button></form>
        <a href="{% url 'lead_detail' lead.pk %}">Cancel</a>
    </div>
</body>
</html>
