{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Convert Lead - SalesAI CRM</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="page-box">
        <h2>Convert Lead to Customer</h2>
        <p>Convert <b>{{ lead.name }}</b> into a customer? This will mark the lead as "Won".</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn">Yes, Convert</button>
        </form>
        <a href="{% url 'lead_list' %}">Cancel</a>
    </div>
</body>
</html>
