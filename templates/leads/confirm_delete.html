{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Lead - SalesAI CRM</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="page-box">
        <h2>Delete Lead</h2>
        <p>Are you sure you want to delete <b>{{ lead.name }}</b>? This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
        <a href="{% url 'lead_list' %}">Cancel</a>
    </div>
</body>
</html>
