{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Delete Product - SalesAI CRM</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
    <div class="page-box">
        <h2>Delete Product</h2>
        <p>Are you sure you want to delete <b>{{ product.name }}</b>?</p>
        <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">Yes, Delete</button></form>
        <a href="{% url 'product_list' %}">Cancel</a>
    </div>
</body>
</html>
